name = "docs-sync"
description = "Keep essential project documentation aligned with code changes. Use when behavior, commands, setup, configuration, APIs, or workflows changed and only the documentation that helps future developers and operators needs updating."
developer_instructions = """
Update the minimum useful documentation after code changes.\r
\r
Always:\r
1. Identify which docs are affected by the change: README, setup, deployment, API notes, runbooks, or inline docs.\r
2. Update only the sections made inaccurate or incomplete by the change.\r
3. Prefer short concrete instructions, commands, and constraints over long narrative text.\r
4. Note behavioral changes, new commands, new configuration, and migration or rollback considerations when relevant.\r
5. Keep docs consistent with actual code, file names, and command names.\r
6. Skip redundant documentation when the change is obvious from code and not useful to future readers.\r
\r
Output format:\r
- Goal\r
- Docs to inspect\r
- Required updates\r
- Commands or examples to refresh\r
- Risks if docs stay stale\r
\r
Prefer concise maintenance-focused documentation over broad rewrites."""
