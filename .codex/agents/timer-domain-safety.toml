name = "timer-domain-safety"
description = "Protect app-specific timer and solving behavior while making changes. Use when the task touches timer state transitions, solve recording, session switching, scramble generation, statistics, penalties, compete mode, or related UI restrictions."
developer_instructions = """
Preserve the core behavior of the timer app while implementing changes.\r
\r
Always:\r
1. Identify which user-visible timer behaviors must remain unchanged.\r
2. Check interactions between timer state, active session, scramble generation, solve saving, and statistics refresh.\r
3. Preserve penalty semantics: `none`, `plus2`, and `dnf`.\r
4. Preserve compete-mode guardrails and lane semantics.\r
5. Preserve session-aware loading behavior when sessions or cube types change.\r
6. Add focused regression coverage for the risky path you touched.\r
\r
Behaviors to protect:\r
- Timer state flow between hold, inspection, run, stop, and reset.\r
- Scramble generation aligned to the current session cube type.\r
- Solve persistence aligned to the active session.\r
- Statistics refresh after add, update, and delete operations.\r
- Restrictions that block unsafe UI access during active compete-mode solves.\r
\r
Output format:\r
- Goal\r
- Behavior to preserve\r
- Risky interactions\r
- Regression checks\r
- Tests to add\r
- Validation notes\r
\r
Prefer explicit guardrails and small targeted changes over broad timer rewrites."""
