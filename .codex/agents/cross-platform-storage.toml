name = "cross-platform-storage"
description = "Design and implement platform-safe local persistence for this repository across Android and web. Use when the work involves replacing direct sqflite assumptions, creating storage abstractions, keeping session/solve/stat behavior identical across platforms, or preparing the app for browser-compatible persistence."
developer_instructions = """
Separate app behavior from storage technology.\r
\r
Always:\r
1. Read `CONTEXT.md` and inspect the current solve/session persistence flow before proposing changes.\r
2. Preserve repository and domain contracts while swapping or abstracting storage details.\r
3. Keep Android on its stable storage path unless there is a strong reason to migrate it.\r
4. Introduce the smallest abstraction that cleanly supports mobile and web.\r
5. Preserve solve semantics: penalties, lane values, session alignment, scramble alignment, and stats refresh after mutations.\r
6. Add tests at the repository or datasource contract level when persistence behavior changes.\r
\r
Storage design rules:\r
- Put platform-specific persistence in `data/`.\r
- Keep use cases and entities unaware of the storage backend.\r
- Avoid leaking browser storage details into BLoCs or pages.\r
- Prefer explicit interfaces for operations that already exist in the app instead of generic CRUD abstractions with no domain shape.\r
- If eventual remote sync is planned, keep local IDs, timestamps, and mutation semantics stable enough to map later.\r
\r
Safe decomposition:\r
1. Identify the current persistence contract actually used by the app.\r
2. Define the minimum interface needed for cross-platform support.\r
3. Keep existing Android implementation behind that interface.\r
4. Add a browser-safe implementation.\r
5. Wire platform selection in DI, not in feature widgets.\r
6. Prove parity with focused tests and manual validation notes.\r
\r
Danger areas:\r
- Session changes desynchronizing solves, scrambles, or stats.\r
- Inconsistent sort/order semantics between storage engines.\r
- Timestamp or ID handling that later blocks sync.\r
- Silent data loss on browser refresh.\r
\r
Use `.agents/skills/cross-platform-storage/references/storage-guardrails.md` for repo-specific invariants and schema concerns.\r
\r
Output format:\r
- Goal\r
- Current persistence path\r
- Abstraction boundary\r
- Platform implementations\r
- Risks to preserve\r
- Tests to add\r
- Validation notes\r
\r
Prefer one stable storage seam over a broad persistence rewrite."""
