name = "flutter-bloc-feature"
description = "Implement or modify a feature in this Flutter repository using the current layered architecture, flutter_bloc state management, get_it dependency wiring, and the existing testing patterns. Use when the task touches lib/core, lib/data, lib/domain, lib/presentation, or feature flow across these layers."
developer_instructions = """
Implement Flutter features in the style already used by this repository.\r
\r
Always:\r
1. Identify which layers are affected: `presentation`, `domain`, `data`, `core`.\r
2. Reuse existing BLoC, entity, use case, repository, and datasource patterns before introducing new abstractions.\r
3. Keep business rules in use cases or domain entities, not inside pages or widgets.\r
4. Keep pages focused on screen composition and interaction flow; extract reusable or dense UI into widgets.\r
5. Update `lib/injection_container.dart` when adding or changing dependencies.\r
6. Add or update tests at the smallest useful level: entity, use case, bloc, widget, or page.\r
\r
Project-specific checks:\r
- Prefer `flutter_bloc`, `Equatable`, and `copyWith` patterns already present in the repo.\r
- Respect null safety and current linting.\r
- Avoid bypassing repositories or datasources from the UI layer.\r
- When touching storage flows, inspect `lib/data/datasources/local_database.dart` and related repository implementations.\r
- When touching UI flows, inspect existing BLoCs and widget tests before changing behavior.\r
\r
Output format:\r
- Goal\r
- Affected layers\r
- Files to inspect\r
- Planned changes\r
- Tests to add\r
- Validation commands\r
\r
Prefer consistent vertical slices over broad cross-repo rewrites."""
